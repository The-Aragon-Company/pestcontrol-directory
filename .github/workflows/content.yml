name: generate-content

# Fills unique Gemini SEO copy for city/category pages, caches it in the DB,
# commits back. Free. Requires repo secret GEMINI_API_KEY (Settings > Secrets
# > Actions > New repository secret).
#
# Commits land on `dev`, never main — main's ruleset requires a PR through the
# merge queue and no workflow may bypass it. The cron still needs this file on
# the default branch to fire; only the checkout and push target are dev.

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "city or category"
        default: "city"
      limit:
        description: "max city pages this run"
        default: "150"
  schedule:
    - cron: "30 1 * * *"      # daily, offset from the scraper

concurrency:
  group: db-writer        # shared with scrape.yml so DB writes never overlap
  cancel-in-progress: false

permissions:
  contents: write

env:
  DATA_BRANCH: dev          # the bot commits here; main is protected

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev          # scheduled runs default to main — force dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate copy
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ] && [ -z "$GEMINI_API_KEY" ]; then
            echo "No GROQ_API_KEY / GEMINI_API_KEY secret set — skipping."; exit 0
          fi
          KIND="${{ github.event.inputs.kind }}"; KIND=${KIND:-city}
          LIMIT="${{ github.event.inputs.limit }}"; LIMIT=${LIMIT:-60}
          python web/gen_content.py --kind category || true
          python web/gen_content.py --kind "$KIND" --limit "$LIMIT" || true

      - name: Commit content
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/pestcontrol.db
          if git diff --cached --quiet; then
            echo "no DB changes to commit"; exit 0
          fi
          git commit -m "content: generate batch of SEO copy"
          # resilient push: rebase + retry to survive concurrent commits
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$DATA_BRANCH"; then exit 0; fi
            echo "push rejected, rebasing (attempt $i)..."
            git pull --rebase --autostash -X theirs origin "$DATA_BRANCH" || true
            sleep $((RANDOM % 5 + 2))
          done
          echo "::error::could not push the DB to $DATA_BRANCH after 5 attempts"; exit 1
