name: scrape-pestcontrol

# The one recurring data job: discovery AND maintenance in a single pass.
#
# Every 2 hours the runner takes the next batch of category x city targets,
# then re-verifies a slice of the least-recently-checked listings by their
# Google CID. The second half is what scraper/refresh.py used to do weekly —
# folding it in here means a place that quietly closed gets retired within
# days instead of a quarter, and one run can't race the other for the DB.
#
# The runner's disposable IP touches Google, never yours. Each run advances a
# saved offset and commits the DB back to `dev` — main is protected, so the
# bot never writes to it. Note the cron still needs this file present on the
# default branch (main) for the schedule to fire; only the checkout and the
# commit target are pinned to dev.
#
# Make the repo PUBLIC for unlimited free Actions minutes (private = 2,000/mo).

on:
  workflow_dispatch:          # run manually from the Actions tab
    inputs:
      batch:
        description: "jobs per run"
        default: "60"
      max_results:
        description: "places per query"
        default: "30"
      offset:
        description: "force a start offset (blank = use saved)"
        default: ""
      verify:
        description: "stalest listings to re-verify (0 = discovery only)"
        default: "200"
  schedule:
    - cron: "0 */2 * * *"     # every 2 hours

# never let two DB-writing runs overlap (scrape + content share this group)
concurrency:
  group: db-writer
  cancel-in-progress: false

permissions:
  contents: write             # to push the DB back

env:
  DATA_BRANCH: dev            # the bot commits here; main is protected

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev            # scheduled runs default to main — force dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps + Chromium
        run: |
          pip install -r requirements-scrape.txt
          python -m playwright install --with-deps chromium

      - name: Resolve batch offset
        id: off
        run: |
          TOTAL=$(python -c "import sys; sys.path.insert(0,'scraper'); import targets; print(sum(1 for _ in targets.jobs()))")
          SAVED=$(cat data/.offset 2>/dev/null || echo 0)
          FORCED="${{ github.event.inputs.offset }}"
          OFFSET=${FORCED:-$SAVED}
          # wrap around when we reach the end -> continuous refresh
          if [ "$OFFSET" -ge "$TOTAL" ]; then OFFSET=0; fi
          echo "offset=$OFFSET" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL"   >> "$GITHUB_OUTPUT"
          echo "Batch starts at offset $OFFSET of $TOTAL total jobs"

      - name: Scrape one batch + verify the stalest listings
        env:
          PCD_CLOUD_CI: "1"     # runner IP is disposable -> bare-IP allowed here
        run: |
          BATCH="${{ github.event.inputs.batch }}"; BATCH=${BATCH:-60}
          MAXR="${{ github.event.inputs.max_results }}"; MAXR=${MAXR:-30}
          VERIFY="${{ github.event.inputs.verify }}"; VERIFY=${VERIFY:-200}
          python scraper/scrape.py \
            --offset ${{ steps.off.outputs.offset }} \
            --limit "$BATCH" \
            --max-results "$MAXR" \
            --verify "$VERIFY"

      - name: Clean (junk, ghosts, duplicates)
        run: python scraper/clean.py

      - name: Advance offset + commit data
        id: commit
        run: |
          BATCH="${{ github.event.inputs.batch }}"; BATCH=${BATCH:-60}
          NEXT=$(( ${{ steps.off.outputs.offset }} + BATCH ))
          if [ "$NEXT" -ge "${{ steps.off.outputs.total }}" ]; then NEXT=0; fi
          echo "$NEXT" > data/.offset
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/pestcontrol.db data/.offset
          STATS=$(python -c "import sys; sys.path.insert(0,'scraper'); import db; c=db.connect(); print(f'{db.count(c)} live / {db.count_all(c)} total')")
          if ! git commit -m "scrape: batch @${{ steps.off.outputs.offset }} -> ${STATS}"; then
            echo "nothing to commit"; echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # resilient push: rebase + retry to survive concurrent commits
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$DATA_BRANCH"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "push rejected, rebasing (attempt $i)..."
            git pull --rebase --autostash -X theirs origin "$DATA_BRANCH" || true
            sleep $((RANDOM % 5 + 2))
          done
          echo "::error::could not push the DB to $DATA_BRANCH after 5 attempts"; exit 1

  # No deploy job here on purpose. This used to call deploy.yml directly,
  # because a bot push to main doesn't fire `push`. Now the batch lands on dev
  # and the deploy hook still points at main, so calling it here would deploy
  # main *without* the rows we just committed. The deploy fires when dev
  # reaches main — see the trigger in deploy.yml.
