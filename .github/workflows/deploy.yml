name: deploy

# Ships main to Vercel by firing the project's deploy hook. No Vercel CLI and
# no token needed — the hook URL is the credential, so it lives in the repo
# secret VERCEL_DEPLOY_HOOK (Settings > Secrets and variables > Actions).
# Create the hook in Vercel: Project > Settings > Git > Deploy Hooks, pointed
# at `main`. VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID are no longer
# used and can be deleted.
#
# Fires on:
#   - main changing (the `push` trigger below) — normally a dev -> main PR
#     merge, which carries along every scrape/content commit made since the
#     last one.
#   - `workflow_call`, for whatever lands dev on main to invoke directly.
#
# scrape.yml and content.yml no longer call this. They commit to dev, and the
# hook below points at main, so deploying at the end of a scrape would ship
# main without the rows that run just wrote.
#
# IMPORTANT: pushes made with the default GITHUB_TOKEN do NOT fire `push`
# events. If dev -> main is ever automated with a token push rather than a
# merged PR, this workflow will stop firing and that automation must call it
# via `workflow_call` as its last step.

on:
  push:
    branches: [main]
  workflow_dispatch:        # allow manual test runs
  workflow_call: {}         # let scrape.yml reuse this

# only one deploy at a time; newest push wins
concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Fire Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK secret is not set — nothing was deployed."
            exit 1
          fi
          CODE=$(curl -sS -X POST "$HOOK" -o body.json -w '%{http_code}')
          echo "HTTP $CODE"; cat body.json; echo
          if [ "$CODE" -ge 300 ]; then
            echo "::error::Deploy hook rejected the request (HTTP $CODE). Check that the"
            echo "::error::hook still exists in Vercel and that the project has a Git repo connected."
            exit 1
          fi
          echo "Deploy triggered — watch it at https://vercel.com/dashboard"
