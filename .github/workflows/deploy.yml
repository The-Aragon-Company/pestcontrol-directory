name: deploy

# Ships main to Vercel by firing the project's deploy hook. No Vercel CLI and
# no token needed — the hook URL is the credential, so it lives in the repo
# secret VERCEL_DEPLOY_HOOK (Settings > Secrets and variables > Actions).
#
# Fires on:
#   - a human push to main (the `push` trigger below)
#   - the end of scrape.yml / content.yml, which call this workflow directly.
#     They have to: pushes made with the default GITHUB_TOKEN do NOT fire
#     `push` events, so their data commits would otherwise never deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:        # allow manual test runs
  workflow_call:            # let scrape.yml / content.yml reuse this

# only one deploy at a time; newest push wins
concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Fire Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK secret is not set — nothing was deployed."
            exit 1
          fi
          CODE=$(curl -sS -X POST "$HOOK" -o body.json -w '%{http_code}')
          echo "HTTP $CODE"; cat body.json; echo
          if [ "$CODE" -ge 300 ]; then
            echo "::error::Deploy hook rejected the request (HTTP $CODE). Check that the"
            echo "::error::hook still exists in Vercel and that the project has a Git repo connected."
            exit 1
          fi
          echo "Deploy triggered — watch it at https://vercel.com/dashboard"
